[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgindex"
version = "0.4.0"
description = "Telegram public-channel search and monitoring, with a threat-intelligence layer"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["telegram", "osint", "threat-intelligence", "search", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28",
  "lxml>=4.9",
]

[project.urls]
Homepage = "https://github.com/sxi9/tgindex"
Issues = "https://github.com/sxi9/tgindex/issues"

[project.scripts]
tgindex = "tgindex.cli:main"

[tool.setuptools]
packages = ["tgindex"]

[tool.setuptools.package-data]
tgindex = ["data/*.txt"]
