name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check SQLite has FTS5
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect(":memory:")
          c.execute("CREATE VIRTUAL TABLE t USING fts5(x)")
          print("FTS5 available,", sqlite3.sqlite_version)
          PY

      - name: Run tests
        run: python tests.py

      - name: Smoke test the CLI
        run: |
          python -m tgindex --db ci.db seed durov
          python -m tgindex --db ci.db stats

      - name: Build and install the wheel
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl

      - name: Verify the installed package
        run: |
          cd "$(mktemp -d)"
          tgindex --help
          tgindex --db pkg.db seed cyber-seeds
          tgindex --db pkg.db stats
          python -c "from tgindex.entities import tlds; assert len(tlds()) > 1000; print('package data ok:', len(tlds()), 'TLDs')"
